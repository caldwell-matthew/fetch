# DRAFT — the Playwright jobs to add to MentorTwo's .circleci/config.yml. Not wired anywhere yet.
#
# Assumes the e2e/ folder has moved into MentorTwo (it is self-contained for that reason). Until it
# does, the job would need a second checkout of this repo, which needs a deploy key.
#
# Two jobs, because the suites cost very different amounts of time:
#
#   e2e_smoke  after every dev deploy. READ-ONLY suites only, so it can never damage the shared
#              fixtures, and short enough to report back while the deploy is still fresh.
#   e2e_full   nightly (or weekly). Every suite in the safe order, with the fixture checks between
#              the data-changing ones — that ordering is `mobile/tools/playwright_pass.py`, which is Python, so this
#              job needs Python as well as Node.
#
# Neither job gates the deploy: dev is already serving the build when they start. A red is a report,
# not a rollback. The same jobs could later gate promotion to `stage`.
#
# ⚠️ Open questions before this can run (checklist ▶ #37):
#   - Can CircleCI's cloud runners reach dev.mentorapm.com, or does dev only accept known IPs?
#   - Which context holds DATA_DOG_EMAIL / DATA_DOG_PASSWORD / MOBDEV? (Proposed: `mobile-e2e`.)
#   - Where do results go — Slack, email, or both? The coverage page is an artifact either way; a summary comment on
#     the commit, as MentorTwo's scripts/ci/reportCircleCiCoverage.mjs posts for Jest, would reuse its GitHub App.

version: 2.1

commands:
  wait_for_dev_build:
    description: >-
      Wait until dev serves the build this pipeline deployed. composer_deploy can finish before dev has restarted on
      it, and a smoke run against the previous build would report on the wrong code. The mobile page names its bundle
      after package.json's version, minus `rc.` (`mobile.2026.7.0-128.bundle.js` for `2026.7.0-rc.128`).
    steps:
      - run:
          name: Wait for dev to serve this build
          command: |
            set -euo pipefail
            WANT="mobile.$(node -p "require('./package.json').version.replace('rc.', '')").bundle.js"
            URL="${MOBDEV:-https://dev.mentorapm.com/apm-mobile/}"
            for i in $(seq 1 60); do                       # up to 15 minutes
              if curl -fsS "$URL" | grep -q "$WANT"; then echo "dev serves $WANT"; exit 0; fi
              sleep 15
            done
            echo "dev never served $WANT — not testing the wrong build" >&2
            exit 1

jobs:
  e2e_smoke:
    docker:
      # Playwright's own image: Node plus Chromium and its system libraries, pinned to the version
      # in e2e/package-lock.json so the browser matches the one the tests were proven on.
      - image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_directory: ~/project/mentor
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install the e2e packages, and Python for the coverage page (standard library only)
          command: |
            cd e2e && npm ci --no-audit --no-fund
            command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq python3 >/dev/null)
      - wait_for_dev_build
      - run:
          name: Read-only suites against dev
          # workers: 1 comes from playwright.config.ts. Read-only suites could overlap safely, but one
          # at a time keeps dev's load predictable and the logs readable.
          command: |
            cd e2e
            # the config's own reporters: list to the log, JUnit to results/junit.xml, JSON to results/results.json.
            # FULL file names: Playwright reads each argument as a regex, so `MOB.954*` means "MOB.95, then any 4s" and
            # would also run the data-changing MOB.95x suites (2026-09-29, a local run did exactly that).
            npx playwright test \
              mobile/suites/MOB.954_WorkOrders_2_Detail_Open_Tabs_Suite.spec.ts \
              mobile/suites/MOB.961_AssetVerify_1_Jobs_List_Suite.spec.ts \
              mobile/suites/MOB.968_AssetLookup_1_Rows_Tabs_Suite.spec.ts \
              mobile/suites/MOB.975_Phone_Suite.spec.ts
      - run:
          name: The coverage page — passed / failed / pinned, and the gaps
          when: always              # a red run is when it matters most
          command: python3 e2e/mobile/tools/coverage_report.py   # stdlib only; writes e2e/results/coverage/index.html
      - store_test_results:
          path: e2e/results/junit.xml
      - store_artifacts:
          path: e2e/results/coverage         # open index.html from the job's Artifacts tab
          destination: coverage-report
      - store_artifacts:
          path: e2e/results/artifacts        # failure screenshots and traces
          destination: e2e

  e2e_full:
    docker:
      - image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_directory: ~/project/mentor
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Install the e2e packages, and Python for the fixture checks
          command: |
            cd e2e && npm ci --no-audit --no-fund && cd ..
            apt-get update -qq && apt-get install -y -qq python3-venv >/dev/null
            python3 -m venv .venv && .venv/bin/pip install -q -r e2e/requirements.txt
      - wait_for_dev_build
      - run:
          name: Every suite, in the safe order
          # Stops at the first red (the first failure is the one worth reading). Fixture checks run
          # before each data-changing suite and after the last.
          command: .venv/bin/python e2e/mobile/tools/playwright_pass.py
          no_output_timeout: 30m
      - store_artifacts:
          # the pass's summary, its coverage page (<time>-report.html, written by the pass itself), and the evidence
          path: e2e/results/passes
          destination: passes

workflows:
  # ---- merge into MentorTwo's build_and_deploy workflow: ------------------------------------------
  build_and_deploy:
    jobs:
      - e2e_smoke:
          requires:
            - composer_deploy
          context:
            - mobile-e2e
          filters:
            branches:
              only:
                - development          # NEVER stage/production: the suites write to shared data
          # Two deploys close together must not run the suites side by side (trap 1).
          serial-group: << pipeline.project.slug >>/e2e-dev

  # ---- a separate scheduled workflow: ------------------------------------------------------------
  # (CircleCI now prefers a scheduled pipeline set in the project's settings to `triggers:`; either runs this workflow.)
  nightly_e2e:
    triggers:
      - schedule:
          cron: "0 9 * * *"             # 02:00 Pacific
          filters:
            branches:
              only:
                - development
    jobs:
      - e2e_full:
          context:
            - mobile-e2e
          serial-group: << pipeline.project.slug >>/e2e-dev
